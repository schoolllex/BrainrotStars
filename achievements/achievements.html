<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainrotStars - Succès</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../index/style.css">
    <link rel="stylesheet" href="achievements.css">
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/schoolllex/images/refs/heads/main/BrainrotStar/favicon.ico">
</head>
<body>
    <div class="background-glow">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
    </div>

    <div class="container">
        <header class="navbar">
            <div class="logo">
                <a href="../index/index.html" class="nav-link">
                    <img src="https://raw.githubusercontent.com/schoolllex/images/refs/heads/main/BrainrotStar/BrainrotStar_logo_fc.png" alt="Brainrot Star" class="logo-image">
                </a>
            </div>
            <div class="nav-buttons">
                <a href="../index/index.html" class="btn-nav nav-link">
                    <i data-lucide="home"></i>
                    <span>Accueil</span>
                </a>
                <a href="../shop/shop.html" class="btn-nav shop nav-link">
                    <i data-lucide="store"></i>
                    <span>Boutique</span>
                </a>
                <a href="../collection/collection.html" class="btn-nav collection nav-link">
                    <i data-lucide="library"></i>
                    <span>Collection</span>
                </a>
                <a href="../ranking/ranking.html" class="btn-nav ranking nav-link">
                    <i data-lucide="trophy"></i>
                    <span>Classement</span>
                </a>
                <button type="button" class="btn-nav profile nav-link">
                    <i data-lucide="user"></i>
                    <span>Profil</span>
                </button>
            </div>
        </header>

        <main class="achievements-content">
            <section class="ach-header">
                <div class="ach-header-row">
                    <span class="ach-header-icon"><i data-lucide="award"></i></span>
                    <div class="ach-header-text">
                        <h1>Succès</h1>
                        <p id="ach-summary-text">Chargement…</p>
                    </div>
                    <button id="ach-claim-all" class="ach-claim-all hidden" type="button">
                        <i data-lucide="gift"></i>
                        <span>Tout récupérer</span>
                        <span class="shine" aria-hidden="true"></span>
                    </button>
                </div>
                <div class="ach-progress"><i id="ach-summary-bar"></i></div>
            </section>

            <nav id="ach-filters" class="ach-filters" aria-label="Catégories de succès"></nav>

            <div id="ach-list" class="ach-list"></div>

            <section id="ach-error" class="ach-error hidden">
                <p>Les succès sont indisponibles pour le moment.</p>
                <button id="ach-retry" class="ach-btn" type="button">Réessayer</button>
            </section>
        </main>
    </div>

    <div id="ach-toast" class="ach-toast hidden" role="status" aria-live="polite"></div>

    <div id="ach-celebrate" class="ach-celebrate hidden" role="dialog" aria-modal="true" aria-labelledby="ach-celebrate-title">
        <div class="ach-celebrate-stage">
            <div class="ach-celebrate-light"></div>
            <div class="ach-celebrate-rays"></div>
            <span class="ach-celebrate-trophy" id="ach-celebrate-trophy" aria-hidden="true">🏆</span>
        </div>
        <h2 class="ach-celebrate-title" id="ach-celebrate-title"></h2>
        <p class="ach-celebrate-gold" id="ach-celebrate-gold"></p>
        <div class="ach-celebrate-rewards" id="ach-celebrate-rewards"></div>
        <button id="ach-celebrate-close" class="ach-claim-all ach-celebrate-close" type="button">
            <span>Continuer</span>
            <span class="shine" aria-hidden="true"></span>
        </button>
    </div>

    <div id="ach-fx" class="ach-fx" aria-hidden="true"></div>
    <div id="ach-flash" class="ach-flash" aria-hidden="true"></div>

    <div id="global-loader" class="global-loader hidden" aria-hidden="true">
        <div class="global-loader-spinner"></div>
    </div>

    <script src="../assets/config.js"></script>
  <script src="../assets/playweb-analytics.js"></script>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" integrity="sha384-mkQ3/7FUtcGyoppY6bz/PORYoGqOl7/aSUMn2ymDOJcapfS6PHqxhRTMh1RR0Q6+" crossorigin="anonymous"></script>
    <script src="../assets/realtime.js"></script>

    <script src="../assets/shared-nav.js"></script>
    <script src="../assets/mobile-nav.js"></script>
    <script src="../assets/loading.js"></script>
    <script src="../assets/auth-gate.js"></script>
    <script src="../assets/notif.js"></script>
    <script src="../assets/game-notif.js"></script>
    <script src="../assets/announce.js"></script>
    <script src="../assets/tournament-banner.js"></script>
    <script src="achievements.js"></script>
</body>
</html>
